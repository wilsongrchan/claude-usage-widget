name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Pinned: the macOS 26 arm64 image; its default Xcode has the macOS 26 SDK the app needs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        # The image's default Xcode (26.6) already has the macOS 26 SDK.
        run: xcodebuild -version && xcrun --sdk macosx --show-sdk-version && swiftc --version
      - name: Test
        run: ./build.sh test
      - name: Build ClaudeUsage.zip
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh dist
      - name: Check the version
        run: |
          built=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "build/Claude Usage.app/Contents/Info.plist")
          [[ "$built" == "${GITHUB_REF_NAME#v}" ]] || { echo "Built $built, tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A moved tag (an existing release) only gets its zip replaced; its notes stay as they are.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/ClaudeUsage.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/ClaudeUsage.zip --generate-notes --title "$GITHUB_REF_NAME"
          fi
