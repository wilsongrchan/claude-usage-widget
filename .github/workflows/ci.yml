name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Pinned: macOS 26 arm64 image with Xcode 26.6 (the app needs the macOS 26 SDK).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, so build.sh can read the version
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Build
        run: ./build.sh
      - name: Test
        run: ./build.sh test
