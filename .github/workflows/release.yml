name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Test
        run: ./build.sh test
      - name: Build ClaudeUsage.zip
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh dist
      - name: Check the version
        run: |
          built=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/ClaudeUsage.app/Contents/Info.plist)
          [[ "$built" == "${GITHUB_REF_NAME#v}" ]] || { echo "Built $built, tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A moved tag (an existing release) only gets its zip replaced; its notes stay as they are.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/ClaudeUsage.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/ClaudeUsage.zip --generate-notes --title "$GITHUB_REF_NAME"
          fi
